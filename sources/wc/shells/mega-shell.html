<title>Méga Forge Hashut</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Bitter:wght@400;600;700&display=swap">
<style>
/* Layout : barre rouge (titre + onglets), contenu clair façon fiche officielle, couleur des aptitudes = phase de jeu */
:root{
  color-scheme: light;
  --bar:#6b2119; --bar-dk:#4e170f; --bar-ink:#ffffff;
  --khaki:#b9a979; --olive:#9c8a35; --olive-dk:#6f6123; --gold:#d4ae3f; --gold-dk:#9a7a1c;
  --page:#f1f1f1; --card:#ffffff; --colhead:#d6d6d6; --namebar:#333333; --soft:#ececec;
  --ink:#1b1b1b; --muted:#5f5f5f; --line:#c9c9c9;
  --save:#3e6b26; --disc:#141414; --rim:#b49a48; --bad:#a3231a; --ok:#3e6b26;
  --ph-hero:#9a8a3c; --ph-shoot:#24475f; --ph-fight:#6e2620; --ph-charge:#a8683a;
  --ph-passive:#000000; --ph-end:#4f3866; --ph-defense:#38521b; --ph-move:#5b5b5b;
  --display:"Oswald", "Arial Narrow", Impact, sans-serif;
  --body:"Bitter", Georgia, "Times New Roman", serif;
}
*{box-sizing:border-box}
html,body{background:var(--page);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.in{max-width:820px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
button,select,input{font-family:inherit;font-size:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rim);outline-offset:2px}

/* Barre du haut */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.bar .top{display:flex;align-items:center;gap:10px;min-height:64px;padding-block:8px}
.back{flex:none;display:grid;place-items:center;width:40px;height:40px;margin-left:-8px;background:none;border:0;color:var(--bar-ink);border-radius:4px}
.back:hover{background:rgba(255,255,255,.12)}
.back[hidden]{display:none}
.bar h1{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(20px,5.5vw,30px);line-height:1.05;margin:0;letter-spacing:.01em;min-width:0;overflow:hidden;white-space:normal;text-wrap:balance}
.tabs{display:flex;gap:4px}
.tabs a{flex:1;text-align:center;font-family:var(--display);font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:15px;color:rgba(255,255,255,.7);text-decoration:none;padding:10px 8px 9px;border-bottom:3px solid transparent}
.tabs a[aria-current="page"]{color:#e9c96b;border-bottom-color:#e9c96b}

main{padding-block:16px 40px}
[hidden]{display:none !important}

/* Mémo : tuiles */
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.unit-link{position:relative;aspect-ratio:1;max-width:100%;min-width:0;display:grid;place-items:center;text-align:center;background:var(--namebar);color:#fff;border:0;border-radius:8px;padding:clamp(6px,1.6vw,14px);font:700 clamp(15px,4.2vw,20px)/1.25 var(--body);overflow:hidden;overflow-wrap:normal;word-break:normal;hyphens:none}
.unit-link.has-photo{place-items:end start;text-align:left;background:linear-gradient(to top, rgba(0,0,0,.9) 0%, rgba(0,0,0,.55) 35%, rgba(0,0,0,0) 70%), var(--img) center 30%/cover no-repeat, #e8e5df;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.army-link{background:var(--bar)}
.badge{position:absolute;top:8px;right:8px;background:var(--gold);color:#1b1b1b;border-radius:999px;padding:2px 9px;font:700 14px var(--display);text-shadow:none}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-left:5px solid var(--bar);border-radius:8px;padding:12px 14px;margin-bottom:14px;color:var(--ink);text-decoration:none;box-shadow:0 1px 2px rgba(0,0,0,.12);font-size:14px}
.banner.off{border-left-color:var(--gold-dk)}
.banner-go{flex:none;font:500 13px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--bar)}

/* Fiche */
.sheet{margin-inline:calc(-1 * max(16px, env(safe-area-inset-left,0px)))}
.statband{background:radial-gradient(ellipse at 50% 120%, #c9b85a 0%, var(--olive) 45%, var(--olive-dk) 100%);padding:18px 12px 12px}
.stats{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,78px));justify-content:center;gap:clamp(8px,2.5vw,14px);text-align:center}
.disc{width:min(64px,17vw);aspect-ratio:1;max-width:100%;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 40% 35%, #3a3a3a, var(--disc) 70%);border:3px solid var(--rim);display:grid;place-items:center;color:#fff;font:700 19px var(--body);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.disc.sv{background:radial-gradient(circle at 40% 35%, #5f9440, var(--save) 70%)}
.disc.wd{background:radial-gradient(circle at 40% 35%, #b5463a, #7a1f17 70%)}
.stats .l{font:500 13px var(--display);text-transform:uppercase;letter-spacing:.06em;color:#fff;margin-top:6px}
.unit-pts{margin:12px 0 0;text-align:center;color:#fff;font:600 14px var(--body);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.sec{background:var(--khaki);color:#fff;font:700 17px var(--body);text-transform:uppercase;letter-spacing:.04em;padding:14px 16px;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec.dark{background:var(--namebar)}
.sec.gen{background:var(--bar)}
.sec-r{display:flex;align-items:center;gap:6px;font-size:15px;white-space:nowrap}
.colhead,.vals{display:grid;text-align:center;font-variant-numeric:tabular-nums}
.colhead{background:var(--colhead);font:700 14px var(--body);text-transform:uppercase;padding:10px 12px}
.ranged .colhead,.ranged .vals{grid-template-columns:1.2fr repeat(5,1fr)}
.melee .colhead,.melee .vals{grid-template-columns:repeat(5,1fr)}
.weapon{padding:14px 16px 6px;background:var(--page)}
.wname{background:var(--namebar);color:#fff;border-radius:6px;padding:10px 14px;font:700 17px var(--body)}
.vals{font:700 19px var(--body);padding:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:6px}
.chip{border:2px dashed #555;border-radius:6px;padding:3px 10px;font:700 14px var(--body);background:var(--card)}
.abilities{padding:16px;display:grid;gap:12px;background:var(--page)}
.ab{border-radius:12px;overflow:hidden;border:3px solid var(--c);background:var(--card)}
.ab-head{background:var(--c);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;font:700 16px/1.3 var(--body)}
.cast{flex:none;width:36px;height:36px;border-radius:50%;background:#000;border:2px solid #fff;display:grid;place-items:center;font-size:16px}
.chant{flex:none;width:30px;height:30px;margin:3px;transform:rotate(45deg);background:#000;border:2px solid #fff;display:grid;place-items:center}
.chant span{transform:rotate(-45deg);font-size:15px}
.cost{flex:none;font:700 16px var(--body);white-space:nowrap}
.hero-photo{background:radial-gradient(ellipse at center, #fbfaf7 0%, #e3dfd8 100%);display:flex;justify-content:center}
.hero-photo img{display:block;width:100%;max-width:640px;max-height:300px;object-fit:contain}
.ab-name{padding:12px 16px;font:700 15px var(--body);border-bottom:2px solid #dcdcdc}
.ab-body{padding:12px 16px 14px;max-width:70ch}
.ab-body p{margin:0}
.ab-body p + p{margin-top:8px}
.kw{margin:16px;padding:14px 16px;border:2px solid #9a9a9a;border-radius:10px;background:var(--card);font-size:14px}
.kw b{font-weight:700}
@media (max-width:420px){.ranged .colhead,.ranged .vals{font-size:15px}.vals{font-size:17px}}

/* Phases */
.phases{display:grid;gap:10px}
.phase{border-radius:10px;overflow:hidden;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.phase > summary{list-style:none;cursor:pointer;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;font:700 16px var(--body)}
.phase > summary::-webkit-details-marker{display:none}
.phase > summary .count{flex:none;min-width:28px;height:28px;border-radius:14px;background:rgba(0,0,0,.35);display:grid;place-items:center;font-size:14px;padding:0 8px}
.phase[open] > summary{box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.phase .abilities{padding:12px}
.who{font:700 12px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 4px 2px}
.ab-wrap + .ab-wrap{margin-top:12px}

/* Listes */
.lhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.lhead h2{font:700 24px var(--display);text-transform:uppercase;margin:0}
.lgrid{display:grid;gap:10px}
.lcard{display:grid;gap:4px;text-align:left;background:var(--card);border:2px solid transparent;border-left:6px solid var(--namebar);border-radius:10px;padding:14px 16px;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.lcard.on{border-left-color:var(--bar)}
.lcard:hover{border-color:var(--line)}
.lc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:17px}
.lc-pts{font:700 22px var(--display);font-variant-numeric:tabular-nums}
.lc-pts.over,.bad{color:var(--bad)}
.good{color:var(--ok)}
.lc-sub{font-size:14px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:12px 0 0}
.body .hint{margin:6px 0 0}
.center{text-align:center}

/* Éditeur */
#edit{display:grid;gap:14px}
.panel{background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.panel .sec{font-size:15px;padding:11px 16px}
.body{padding:14px 16px;display:grid;gap:14px}
.lbl{display:flex;align-items:center;gap:8px;font:600 12px var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.cnt{background:var(--soft);color:var(--ink);border-radius:999px;padding:1px 8px;font:700 12px var(--display)}
.cnt.bad{background:var(--bad);color:#fff}
input[type=text],select{width:100%;font:600 16px var(--body);color:var(--ink);background:#f7f7f7;border:2px solid var(--line);border-radius:6px;padding:9px 34px 9px 10px}
input[type=text]{padding-right:10px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--bar) 50%),linear-gradient(135deg,var(--bar) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
input::placeholder{color:#a5a5a5;opacity:1}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pick{border:2px solid var(--line);background:#fff;border-radius:8px;padding:10px 6px;font:700 16px var(--body);min-height:48px}
.pick[aria-pressed="true"]{background:var(--gold);border-color:var(--gold-dk);color:#1b1b1b}
.total .big{font:700 34px var(--display);font-variant-numeric:tabular-nums;line-height:1.1}
.total .big span{font-size:20px;color:var(--muted)}
.total.over .big{color:var(--bad)}
.meter{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;margin:8px 0 6px}
.meter span{display:block;height:100%;background:var(--gold-dk)}
.total.over .meter span{background:var(--bad)}
.sub{display:flex;justify-content:space-between;gap:8px;font:600 14px var(--body);color:var(--muted)}
.btn{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:10px 14px;font:700 15px var(--body);min-height:46px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--bar);border-color:var(--bar);color:#fff}
.btn.primary:hover{background:var(--bar-dk)}
.btn.danger{color:var(--bad)}
.btn.wide{width:100%;border-style:dashed}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ent{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;align-items:center;background:#f7f7f7;border:1px solid var(--line);border-radius:8px;padding:10px 8px 10px 12px;margin-bottom:8px}
.ent-name{font-weight:700;line-height:1.25}
.ent-meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:2px}
.ent-meta b{color:var(--ink)}
.ent-opts{grid-column:1 / -1;display:grid;gap:8px}
.ent-opts select{font-size:14px;padding-block:7px;background-color:#fff}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--bar)}
.del{flex:none;width:38px;height:38px;border-radius:8px;border:0;background:none;color:var(--bar);display:grid;place-items:center;padding:0}
.del:hover{background:var(--soft)}
.del.light{color:#fff;width:32px;height:32px}
.del.light:hover{background:rgba(0,0,0,.15)}
.tag{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:4px;background:var(--soft);color:var(--ink)}
.tag.act{background:var(--bar);color:#fff}
.tag.gold{background:var(--gold);color:#1b1b1b}
.note{margin:0;border-left:4px solid var(--bar);background:#fff;padding:10px 12px;border-radius:6px;font-size:14px;box-shadow:inset 0 0 0 1px var(--soft)}
.note.gold{border-color:var(--gold-dk)}
.errs{margin:0;padding-left:20px;color:var(--bad);font-weight:600;font-size:14px;display:grid;gap:4px}
.ok{margin:0;color:var(--ok);font-weight:700}
</style>

<header class="bar">
  <div class="in top">
    <button class="back" id="back" type="button" aria-label="Retour" hidden><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 id="title">Méga Forge Hashut</h1>
  </div>
  <nav class="in tabs">
    <a href="#listes" id="nav-lists">Listes</a>
    <a href="#memo" id="nav-memo">Mémo</a>
    <a href="#phases" id="nav-phases">Phases</a>
  </nav>
</header>

<main class="in">
  <section id="view-lists" hidden><div id="lists"></div></section>
  <section id="view-edit" hidden><div id="edit"></div></section>
  <section id="view-memo"><div id="memo-banner"></div><div class="list" id="list"></div></section>
  <section id="view-unit" hidden><div class="sheet" id="unit"></div></section>
  <section id="view-phases" hidden><div id="phase-banner"></div><div class="phases" id="phases"></div></section>
</main>
